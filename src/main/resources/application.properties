spring.application.name=ecommerce

spring.datasource.url=jdbc:mysql://localhost:3306/ecommercedb
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.password-reset.expose-token=${PASSWORD_RESET_EXPOSE_TOKEN:false}

gmail.api.enabled=true
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID_HERE}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET_HERE}
gmail.api.refresh-token=YOUR_REFRESH_TOKEN
gmail.api.sender=muhammadsufiyandev01@gmail.com

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-for-development}
jwt.expiration=86400000
gemini.api.key=${GEMINI_API_KEY:}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
